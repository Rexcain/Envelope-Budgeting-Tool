<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>信封账本 · Envelope Ledger</title>
<meta name="description" content="A local-first envelope budgeting app with a rolling carry-over cap. 本地优先的信封预算账本。">
<meta name="theme-color" content="#1d5c4b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="appName">信封账本</h1>
      <div class="sub" id="tagline"></div>
    </div>
    <div class="row">
      <button class="ghost" id="langBtn" type="button">EN</button>
      <button class="ghost" id="settingsBtn" type="button">设置</button>
    </div>
  </header>

  <!-- First-run setup and the Settings dialog share this form -->
  <section class="card" id="setup" hidden></section>

  <main id="main" hidden>
    <div class="banner" id="demoBanner" hidden><span id="demoText"></span> <button class="ghost" id="demoClear" type="button"></button></div>

    <div class="monthbar">
      <button class="ghost" id="prevBtn" type="button" aria-label="previous">‹</button>
      <h2 id="monthTitle"></h2>
      <button class="ghost" id="nextBtn" type="button" aria-label="next">›</button>
      <button class="ghost" id="todayBtn" type="button"></button>
    </div>

    <div class="grid4">
      <div class="card stat"><div class="k" id="kSpent"></div><div class="v" id="vSpent"></div><div class="n" id="nSpent"></div></div>
      <div class="card stat"><div class="k" id="kLow"></div><div class="v" id="vLow"></div><div class="n" id="nLow"></div></div>
      <div class="card stat"><div class="k" id="kCarry"></div><div class="v" id="vCarry"></div><div class="n" id="nCarry"></div></div>
      <div class="card stat"><div class="k" id="kCap"></div><div class="v" id="vCap"></div><div class="n" id="nCap"></div></div>
    </div>

    <section class="card">
      <div class="hdr"><h2 id="meterTitle"></h2><span class="tag" id="meterTag"></span></div>
      <div class="mflags" id="flags"></div>
      <div class="meter" id="meter" role="img"></div>
      <div class="mzones" id="zones"></div>
      <p class="msg" id="meterMsg"></p>
      <div class="defs" id="defs"></div>
    </section>

    <section class="card">
      <h2 id="addTitle"></h2>
      <form class="form" id="addForm" autocomplete="off">
        <label class="f"><span id="lAmount"></span><input class="num" id="fAmount" type="number" inputmode="decimal" step="0.01" min="0" required></label>
        <label class="f"><span id="lCat"></span><select id="fCat"></select></label>
        <label class="f"><span id="lDate"></span><input id="fDate" type="date" required></label>
        <label class="f note"><span id="lNote"></span><input id="fNote" type="text" maxlength="80"></label>
        <button class="primary" id="fSubmit" type="submit"></button>
      </form>
    </section>

    <section>
      <div class="hdr" style="margin-bottom:10px"><h2 id="envTitle"></h2><span class="sub num" id="envSum"></span></div>
      <div class="env" id="env"></div>
      <details class="card" style="margin-top:10px" id="budgetDetails">
        <summary id="budgetSummary"></summary>
        <div class="sub" id="budgetFrom" style="margin-top:8px"></div>
        <div class="budget-edit" id="budgetEdit"></div>
        <div class="row" style="margin-top:10px;align-items:center"><button class="primary" id="budgetSave" type="button"></button><span class="sub num" id="budgetTotal"></span></div>
      </details>
    </section>

    <section class="card">
      <div class="hdr"><h2 id="sugTitle"></h2><span class="tag" id="sugTag"></span></div>
      <p class="sub" id="sugIntro"></p>
      <div class="tbl" id="sugTable"></div>
      <div class="row" style="margin-top:10px;align-items:center"><button class="primary" id="sugApply" type="button"></button><span class="sub" id="sugNote"></span></div>
      <details style="margin-top:10px"><summary id="howTitle"></summary><div class="sub how" id="how"></div></details>
    </section>

    <section class="card">
      <h2 id="trendTitle"></h2>
      <div id="trend"></div>
    </section>

    <section class="card">
      <div class="hdr" style="margin-bottom:8px"><h2 id="listTitle"></h2></div>
      <div class="list tbl"><table id="list"></table></div>
    </section>

    <section class="card">
      <h2 id="dataTitle"></h2>
      <p class="sub" id="dataNote"></p>
      <div class="row">
        <button class="ghost" id="exportJson" type="button"></button>
        <label class="ghost filebtn"><span id="importLbl"></span><input id="importFile" type="file" accept="application/json,.json" hidden></label>
        <button class="ghost" id="exportCsv" type="button"></button>
        <button class="ghost danger" id="resetAll" type="button"></button>
      </div>
    </section>
  </main>

  <footer class="sub" id="footer"></footer>
</div>

<div class="scrim" id="editor" hidden>
  <form class="card editor" id="editForm">
    <h2 id="editTitle"></h2>
    <label class="f"><span id="eAmountL"></span><input class="num" id="eAmount" type="number" step="0.01" min="0" required></label>
    <label class="f"><span id="eCatL"></span><select id="eCat"></select></label>
    <label class="f"><span id="eDateL"></span><input id="eDate" type="date" required></label>
    <label class="f"><span id="eNoteL"></span><input id="eNote" type="text" maxlength="80"></label>
    <div class="row" style="justify-content:space-between">
      <button class="ghost danger" id="eDel" type="button"></button>
      <span class="row"><button class="ghost" id="eCancel" type="button"></button><button class="primary" id="eSave" type="submit"></button></span>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" type="button" hidden></button></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
